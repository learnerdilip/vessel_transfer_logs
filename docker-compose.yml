version: "3.8"

services:
  api:
    build: ./json-api
    container_name: json-server-api-container
    ports:
      - "3000:3000"
    volumes:
      - ./json-api/db.json:/app/db.json

  react-frontend:
    build: ./vessel-transfer-frontend
    container_name: vessel-transfer-frontend-container
    ports:
      - "5173:5173"
    volumes:
      - ./vessel-transfer-frontend:/vessel-transfer-frontend
      - /vessel-transfer-frontend/node_modules # Prevent host node_modules from overriding container
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
